<!DOCTYPE html>

<style>

  :root {

  }
  
  body {

  .bubbles {

  }

  #welcome.hide { opacity: 0; transform: scale(1.2); pointer-events: none; }
  
  .welcome-title {

  .mascot {

  @keyframes wiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }

  .mascot-body {
    width: 180px; height: 180px;

  .mascot-eye {

  .mascot-eye.left { left: 40px; }

  /* Contenedor principal */
  #app {

    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .score-item .icon { font-size: 1.5rem; }
  
  /* Menú principal */
  .main-menu {
    display: grid;

  .topic-card {
    background: white;

  }
  .topic-card:hover { transform: translateY(-10px) scale(1.03); }
  .topic-card:hover::before { opacity: 1; }
  
  .topic-card.t1 { border-color: var(--pink); background: linear-gradient(135deg, #fff, #ffe0ec); }
  .topic-card.t2 { border-color: var(--blue); background: linear-gradient(135deg, #fff, #e0ecff); }

  .topic-card.t4 { border-color: var(--orange); background: linear-gradient(135deg, #fff, #fff0d6); }
  .topic-card.t5 { border-color: var(--purple); background: linear-gradient(135deg, #fff, #f0e0ff); }
  
  .topic-icon {
    font-size: 5rem;
    margin-bottom: 15px;
    display: inline-block;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }

  .topic-title {
    font-size: 1.5rem;

  .topic-desc {

  }
  .topic-stars {

  /* Vista de tema */
  .topic-view {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    animation: fadeIn 0.5s;
  }
  .topic-view.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .topic-header {
    background: white;
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);

  }
  .topic-header .icon { font-size: 4rem; }
  .topic-header h1 { font-size: 2rem; color: #333; }
  
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;

  .tab {
    flex: 1;

  .tab:hover { transform: translateY(-3px); }

  .tab-content {

  }
  .tab-content.active { display: block; }
  
  .tab-content h2 {

  .tab-content h3 {

  /* Conceptos visuales */
  .concept-box {
    background: linear-gradient(135deg, #fff8e7, #ffe0ec);
    border-radius: 20px;
    padding: 25px;
    margin: 20px 0;
    border-left: 8px solid var(--pink);
  }
  .concept-box.blue { background: linear-gradient(135deg, #e0ecff, #fff8e7); border-color: var(--blue); }
  .concept-box.green { background: linear-gradient(135deg, #e0ffe6, #fff8e7); border-color: var(--green); }
  
  /* Pizza visual */
  .pizza-demo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  .pizza {
    width: 200px; height: 200px;
    position: relative;
    border-radius: 50%;
    background: #ffd93d;
    border: 5px solid #c44569;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }
  .pizza-slice {
    position: absolute;
    width: 50%; height: 50%;
    top: 0; left: 50%;
    transform-origin: 0% 100%;
    background: #ff6b9d;
    clip-path: polygon(0 100%, 100% 100%, 100% 0);
    transition: all 0.5s;
  }
  .pizza-slice.empty { background: #ffe0ec; }
  
  /* Recta numérica */
  .number-line {
    position: relative;
    height: 80px;
    margin: 30px 20px;
    background: linear-gradient(90deg, #fff, #ffe0ec);

  .number-line-bar {
    position: absolute;
    top: 40px;
    left: 20px; right: 20px;
    height: 4px;
    background: #333;
  }
  .number-line-tick {
    position: absolute;
    top: 30px;
    width: 2px; height: 24px;
    background: #333;
  }
  .number-line-label {
    position: absolute;
    top: 60px;
    font-size: 1rem;
    font-weight: bold;
    transform: translateX(-50%);
  }
  .number-line-point {
    position: absolute;
    top: 25px;
    width: 30px; height: 30px;
    background: var(--red);
    border-radius: 50%;
    border: 3px solid white;
    transform: translateX(-50%);
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    animation: pop 0.5s;
  }
  @keyframes pop {
    0% { transform: translateX(-50%) scale(0); }
    100% { transform: translateX(-50%) scale(1); }
  }

  .fraction-display {

    flex-direction: column;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    margin: 0 10px;

  }
  .fraction-display .num {
    color: var(--pink);

  }
  .fraction-display .line {

    height: 3px;
    background: #333;
    margin: 3px 0;
  }
  .fraction-display .den {
    color: var(--blue);
    padding: 0 10px;
  }
  
  /* Ejercicios */
  .exercise {
    background: linear-gradient(135deg, #fff, #f0f8ff);
    border: 4px dashed var(--blue);
    border-radius: 20px;
    padding: 25px;
    margin: 20px 0;
  }
  .exercise-title {
    font-size: 1.3rem;
    color: var(--blue);
    margin-bottom: 15px;
    font-weight: bold;
  }
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin: 20px 0;
  }
  .option-btn {
    padding: 15px;
    background: white;
    border: 4px solid var(--blue);
    border-radius: 15px;
    cursor: pointer;
    font-size: 1.3rem;
    font-weight: bold;
    transition: all 0.3s;
    color: #333;
  }
  .option-btn:hover { background: var(--blue); color: white; transform: scale(1.05); }
  .option-btn.correct { background: var(--green); color: white; border-color: var(--green); animation: correct 0.5s; }
  .option-btn.wrong { background: var(--red); color: white; border-color: var(--red); animation: shake 0.5s; }
  @keyframes correct {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  
  .feedback {
    padding: 15px;
    border-radius: 15px;
    margin: 15px 0;
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
    display: none;
  }
  .feedback.show { display: block; animation: fadeIn 0.3s; }
  .feedback.success { background: var(--green); color: white; }
  .feedback.error { background: var(--red); color: white; }
  
  .btn-action {
    padding: 12px 30px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: bold;
    box-shadow: 0 5px 0 #333;
    transition: all 0.2s;
    margin: 10px 5px;
  }
  .btn-action:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #333; }
  .btn-action:active { transform: translateY(3px); box-shadow: 0 2px 0 #333; }
  .btn-action.back { background: linear-gradient(135deg, #999, #666); }
  
  /* Juego de memoria */
  .memory-game {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    max-width: 500px;
    margin: 20px auto;
  }
  .memory-card {
    aspect-ratio: 1;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border-radius: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: bold;
    color: white;
    transition: all 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border: 3px solid white;
  }
  .memory-card.flipped {
    background: white;
    color: #333;
    transform: rotateY(180deg);
  }
  .memory-card.matched {
    background: var(--green);
    color: white;
    animation: correct 0.5s;
  }
  
  /* Juego de arrastrar */
  .drag-game {
    display: flex;
    gap: 30px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  .drag-items, .drop-zones {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
  }
  .drag-item {
    padding: 15px 25px;
    background: var(--yellow);
    border: 3px solid #c44569;
    border-radius: 15px;
    cursor: grab;
    font-size: 1.3rem;
    font-weight: bold;
    user-select: none;
    transition: transform 0.2s;
  }
  .drag-item:active { cursor: grabbing; transform: scale(1.1); }
  .drop-zone {
    width: 200px;
    min-height: 60px;
    border: 4px dashed var(--blue);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: #999;
    background: #f0f8ff;
  }
  .drop-zone.over { background: #fff0d6; border-color: var(--orange); }
  .drop-zone.filled { background: var(--green); color: white; border-style: solid; }
  
  /* Transportador para ángulos */
  .protractor-game {
    text-align: center;
  }
  .angle-display {
    width: 250px; height: 250px;
    margin: 20px auto;
    position: relative;
    border-radius: 50%;
    background: white;
    border: 5px solid var(--orange);
  }
  .angle-line {
    position: absolute;
    bottom: 50%;
    left: 50%;
    width: 4px; height: 50%;
    background: var(--red);
    transform-origin: bottom center;
    border-radius: 2px;
  }
  .angle-base {
    position: absolute;
    bottom: 50%;
    left: 50%;
    width: 4px; height: 50%;
    background: var(--blue);
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(0deg);
  }
  
  .slider-container {
    margin: 20px 0;
  }
  input[type="range"] {
    width: 100%;
    max-width: 400px;
    height: 10px;
    border-radius: 5px;
    background: #ddd;
    outline: none;
    -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--pink);
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  
  /* Confeti */
  .confetti {

    z-index: 9999;
    animation: confetti-fall 3s linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  
  /* Modal de recompensa */
  .reward-modal {

    width: 100%; height: 100vh;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .reward-modal.show { display: flex; animation: fadeIn 0.3s; }
  .reward-content {
    background: white;
    border-radius: 30px;
    padding: 40px;
    text-align: center;
    max-width: 400px;
    border: 8px solid var(--yellow);
    animation: pop 0.5s;
  }
  .reward-content h2 {
    font-size: 2.5rem;
    color: var(--pink);
    margin-bottom: 20px;
  }
  .reward-stars {
    font-size: 4rem;
    margin: 20px 0;
  }
  
  /* Responsive */
  @media (max-width: 768px) {
    .welcome-title { font-size: 2.5rem; }
    .welcome-subtitle { font-size: 1.3rem; }
    .logo { font-size: 1.3rem; }
    .score-item { padding: 5px 12px; font-size: 1rem; }
    .topic-header h1 { font-size: 1.5rem; }
    .topic-header .icon { font-size: 3rem; }
  }
  
  /* Animación de estrellas ganando */
  .star-earned {
    display: inline-block;
    animation: star-spin 1s;
  }
  @keyframes star-spin {
    0% { transform: scale(0) rotate(0); }
    50% { transform: scale(1.5) rotate(360deg); }
    100% { transform: scale(1) rotate(720deg); }
  }
  
  .info-box {
    background: #fff8e7;
    border-left: 6px solid var(--yellow);
    padding: 15px 20px;
    border-radius: 10px;
    margin: 15px 0;
    font-size: 1.1rem;
  }
  .info-box strong { color: var(--pink); }
  
  .mixed-number {
    display: inline-flex;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    margin: 0 10px;
  }
  .mixed-number .whole {
    color: var(--green);
    font-size: 2.5rem;
  }
  
  .interactive-fraction {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  .fraction-grid {
    display: grid;
    gap: 3px;
    padding: 10px;
    background: white;
    border: 4px solid var(--blue);
    border-radius: 15px;
  }
  .fraction-cell {
    width: 40px; height: 40px;
    background: #f0f0f0;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fraction-cell.active { background: var(--pink); transform: scale(1.1); }
  .fraction-cell:hover { background: #ffe0ec; }
  
  .progress-bar {
    width: 100%;
    height: 20px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin: 15px 0;
    border: 3px solid white;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--blue));
    transition: width 0.5s;

// ============ AUDIO ============
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.log('Audio no disponible'); }
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.2) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playCorrect() {
  playTone(523, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(659, 0.1, 'sine', 0.2), 100);
  setTimeout(() => playTone(784, 0.2, 'sine', 0.2), 200);
}

  playTone(200, 0.15, 'sawtooth', 0.15);

}

}

// ============ DIBUJAR PIZZA ============
function drawPizza(id, total, filled) {
  const pizza = document.getElementById(id);
  if (!pizza) return;
  pizza.innerHTML = '';
  const angleStep = 360 / total;
  for (let i = 0; i < total; i++) {
    const slice = document.createElement('div');
    slice.className = 'pizza-slice' + (i < filled ? '' : ' empty');
    slice.style.transform = `rotate(${i * angleStep - 90}deg)`;
    pizza.appendChild(slice);
  }
  // Líneas divisorias
  for (let i = 0; i < total; i++) {
    const line = document.createElement('div');
    line.style.cssText = `position:absolute; top:50%; left:50%; width:50%; height:2px; background:#c44569; transform-origin:left center; transform:rotate(${i * (360/total)}deg);`;
    pizza.appendChild(line);
  }
}

// ============ RECTA NUMÉRICA ============
function drawNumberLine(id, denominator, numerator) {
  const nl = document.getElementById(id);
  if (!nl) return;
  nl.innerHTML = '<div class="number-line-bar"></div>';
  const totalWidth = nl.offsetWidth - 40;
  // Marcas del 0 al 1
  for (let i = 0; i <= denominator; i++) {
    const tick = document.createElement('div');
    tick.className = 'number-line-tick';
    tick.style.left = (20 + (i / denominator) * totalWidth) + 'px';
    nl.appendChild(tick);
    
    const label = document.createElement('div');
    label.className = 'number-line-label';
    label.style.left = (20 + (i / denominator) * totalWidth) + 'px';
    label.textContent = i === 0 ? '0' : i === denominator ? '1' : `${i}/${denominator}`;
    nl.appendChild(label);
  }
  // Punto de la fracción
  const point = document.createElement('div');
  point.className = 'number-line-point';
  point.style.left = (20 + (numerator / denominator) * totalWidth) + 'px';
  nl.appendChild(point);
}

// ============ JUEGO MEMORIA ============
let memoryCards = [];
let flippedCards = [];
let matchedPairs = 0;

function initMemoryGame() {
  const pairs = [
    { id: 1, text: '1/2', match: '2/4' },
    { id: 2, text: '2/3', match: '4/6' },
    { id: 3, text: '3/4', match: '6/8' },
    { id: 4, text: '1/4', match: '2/8' }
  ];
  memoryCards = [];
  pairs.forEach(p => {
    memoryCards.push({ id: p.id, text: p.text, pairId: p.id });
    memoryCards.push({ id: p.id, text: p.match, pairId: p.id });
  });
  memoryCards.sort(() => Math.random() - 0.5);
  flippedCards = [];
  matchedPairs = 0;
  renderMemory();
}

function renderMemory() {
  const game = document.getElementById('memoryGame');
  if (!game) return;
  game.innerHTML = '';
  memoryCards.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'memory-card' + (card.flipped ? ' flipped' : '') + (card.matched ? ' matched' : '');
    div.textContent = card.flipped || card.matched ? card.text : '?';
    div.onclick = () => flipCard(i);
    game.appendChild(div);
  });
}

function flipCard(i) {
  if (memoryCards[i].flipped || memoryCards[i].matched || flippedCards.length >= 2) return;
  playPop();
  memoryCards[i].flipped = true;
  flippedCards.push(i);
  renderMemory();
  
  if (flippedCards.length === 2) {
    const [a, b] = flippedCards;
    if (memoryCards[a].pairId === memoryCards[b].pairId) {
      setTimeout(() => {
        memoryCards[a].matched = true;
        memoryCards[b].matched = true;
        playCorrect();
        matchedPairs++;
        addPoints(15);
        flippedCards = [];
        renderMemory();
        if (matchedPairs === 4) {
          setTimeout(() => showReward('¡Ganaste el juego!', '¡Encontraste todos los pares!', 3), 500);
        }
      }, 500);
    } else {
      setTimeout(() => {
        playWrong();
        memoryCards[a].flipped = false;
        memoryCards[b].flipped = false;
        flippedCards = [];
        renderMemory();
      }, 1000);
    }
  }
}

let raceScore = 0;
let raceTimer = null;
let raceTime = 30;

function startRace() {
  raceScore = 0;
  raceTime = 30;
  document.getElementById('raceScore').textContent = '0';
  document.getElementById('raceTime').textContent = '30';
  document.getElementById('raceProgress').style.width = '0%';
  nextRaceQuestion();
  if (raceTimer) clearInterval(raceTimer);
  raceTimer = setInterval(() => {
    raceTime--;
    document.getElementById('raceTime').textContent = raceTime;
    if (raceTime <= 0) {
      clearInterval(raceTimer);
      document.getElementById('raceArea').innerHTML = `<div class="feedback success show">¡Fin del tiempo! Puntaje: ${raceScore}</div>`;
      if (raceScore >= 5) showReward('¡Increíble!', `Conseguiste ${raceScore} puntos`, raceScore >= 8 ? 3 : raceScore >= 5 ? 2 : 1);
    }
  }, 1000);
}

function nextRaceQuestion() {
  const den = [4, 5, 6, 7, 8, 10][Math.floor(Math.random() * 6)];
  const a = Math.floor(Math.random() * (den - 1)) + 1;
  const b = Math.floor(Math.random() * (den - a)) + 1;
  const op = Math.random() > 0.5 ? '+' : '-';
  const result = op === '+' ? a + b : a - b;
  const correct = `${result}/${den}`;
  
  const options = [correct];
  while (options.length < 4) {
    const fake = `${Math.floor(Math.random() * den) + 1}/${den}`;
    if (!options.includes(fake)) options.push(fake);
  }
  options.sort(() => Math.random() - 0.5);
  
  const area = document.getElementById('raceArea');
  area.innerHTML = `
    <div class="exercise">
      <div class="equation">
        <span class="fraction-display"><span class="num">${a}</span><span class="line"></span><span class="den">${den}</span></span>
        ${op}
        <span class="fraction-display"><span class="num">${b}</span><span class="line"></span><span class="den">${den}</span></span>
        = ?
      </div>
      <div class="options">
        ${options.map(o => `<button class="option-btn" onclick="answerRace('${o}', '${correct}')">${o}</button>`).join('')}
      </div>
    </div>
  `;
}

function answerRace(selected, correct) {
  if (selected === correct) {
    playCorrect();
    raceScore++;
    document.getElementById('raceScore').textContent = raceScore;
    document.getElementById('raceProgress').style.width = Math.min(100, raceScore * 10) + '%';
    addPoints(5);
    nextRaceQuestion();
  } else {
    playWrong();
  }
}

      <div class="feedback" id="fbEq"></div>
    </div>
  `;
}

function answerEq(selected, correct) {
  const btns = document.querySelectorAll('#eqGameArea .option-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('fbEq');
  eqCount++;
  if (selected === correct) {
    playCorrect();
    eqScore++;
    addPoints(15);
    fb.className = 'feedback success show';
    fb.textContent = '¡Correcto! 🎉';
  } else {
    playWrong();
    fb.className = 'feedback error show';
    fb.textContent = `La respuesta era ${correct}`;
  }
  document.getElementById('eqScore').textContent = eqScore;
  setTimeout(nextEqQuestion, 1500);
}

// ============ PUNTOS Y RECOMPENSAS ============
function addPoints(n) {
  state.points += n;
  if (state.points >= 100) {
    state.stars += Math.floor(state.points / 100);
    state.points = state.points % 100;
  }
  updateScore();
  launchConfetti();
}

function updateScore() {
  document.getElementById('stars').textContent = state.stars;
  document.getElementById('points').textContent = state.points;
}

function launchConfetti() {
  const colors = ['#ff6b9d', '#ffd93d', '#4d96ff', '#6bcf7f', '#a66cff', '#ff9f45'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function showReward(title, text, stars) {
  playWin();
  launchConfetti();
  document.getElementById('rewardTitle').textContent = title;
  document.getElementById('rewardText').textContent = text;
  document.getElementById('rewardStars').innerHTML = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('rewardModal').classList.add('show');
  state.stars += stars;
  updateScore();
}

function closeReward() {
  playClick();
  document.getElementById('rewardModal').classList.remove('show');
}
